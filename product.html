<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Details - ToDoList Cart</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <main class="store-shell detail-shell" aria-labelledby="detail-title">
      <header class="store-header">
        <div class="top-row">
          <a class="brand" href="newtab.html" aria-label="Go to ToDoList Cart home">
            <img class="brand-icon" src="icons/icon-48.png" alt="">
            <span class="brand-name">ToDoList Cart</span>
            <span class="brand-domain">.tasks</span>
          </a>

          <div class="detail-search-spacer"></div>


          <a class="page-link-button" href="create-product.html">Create</a>

          <button type="button" class="page-link-button" id="open-products-page">Products</button>
          <a class="page-link-button" href="products.html?view=wishlist">Wishlist</a>
          <a class="page-link-button" id="open-home-page" href="newtab.html">Workspace</a>
          <button type="button" class="page-link-button" id="open-orders-page">Orders</button>
          <button type="button" class="page-link-button" id="open-account-page">Account</button>

          <a class="cart-button" href="newtab.html#cart-panel" aria-label="Open shopping cart">
            <span class="cart-icon" aria-hidden="true"></span>
            <strong id="cart-count">0</strong>
            <span>Cart</span>
          </a>
        </div>
      </header>

      <section id="missing-product" class="empty-state detail-missing" hidden>
        <strong>Product not found</strong>
        <span>This product may have been deleted.</span>
        <button type="button" class="primary-button" id="missing-products-link">View Products</button>
      </section>

      <section id="product-detail" class="detail-card" hidden>
        <div class="detail-image" id="detail-image">
          <span></span>
        </div>

        <article class="detail-copy">
          <p class="detail-kicker">Product description page</p>
          <h1 id="detail-title"></h1>

          <div class="rating-row detail-rating" aria-label="Priority">
            <span id="detail-stars" class="rating-stars" aria-hidden="true">*****</span>
            <span id="detail-priority" class="priority-label"></span>
          </div>

          <dl class="detail-specs">
            <div>
              <dt>Category</dt>
              <dd id="detail-department"></dd>
            </div>
            <div>
              <dt>Location</dt>
              <dd id="detail-location"></dd>
            </div>
            <div>
              <dt>MOQ</dt>
              <dd id="detail-moq"></dd>
            </div>
            <div>
              <dt>Price</dt>
              <dd id="detail-price"></dd>
            </div>
            <div>
              <dt>Created</dt>
              <dd id="detail-created"></dd>
            </div>
          </dl>

          <section class="detail-description" aria-label="Description">
            <h2>About this product</h2>
            <p id="detail-description"></p>
          </section>

        </article>

        <aside class="detail-actions" aria-label="Product actions">
          <div class="cart-manager">
            <label for="cart-select">Active cart</label>
            <select id="cart-select" aria-label="Active cart"></select>
          </div>

          <p id="detail-cart-status" class="detail-cart-status">Not in cart</p>
          <p id="detail-stock-status" class="detail-stock-status" hidden>Out of stock</p>

          <button type="button" id="detail-add-cart" class="add-cart-button">Add to Cart</button>
          <button type="button" id="detail-remove-cart" class="secondary-button">Remove from Cart</button>

          <label class="detail-check">
            <input id="detail-done" type="checkbox">
            <span>Checked out in this cart</span>
          </label>

          <button type="button" id="detail-duplicate" class="secondary-button button-with-icon">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="9" y="9" width="11" height="11" rx="1"></rect>
              <path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"></path>
            </svg>
            <span>Duplicate</span>
          </button>

          <div class="detail-management-actions">
            <button type="button" id="detail-edit" class="secondary-button button-with-icon">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
              </svg>
              <span>Edit</span>
            </button>
            <button type="button" id="detail-delete" class="delete-product-button detail-delete-button button-with-icon">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v5M14 11v5"></path>
              </svg>
              <span>Delete</span>
            </button>
          </div>
        </aside>

        <section class="product-comments" aria-labelledby="comments-heading">
          <div class="comments-heading">
            <h2 id="comments-heading">Comments</h2>
            <span id="comment-count">0 comments</span>
          </div>
          <form id="comment-form" class="comment-form">
            <label class="comment-title-field">
              <span>Title <em>Optional</em></span>
              <input id="comment-title" maxlength="100" placeholder="Comment title">
            </label>
            <label class="comment-body-field">
              <span>Comment</span>
              <textarea id="comment-text" maxlength="500" placeholder="Add a note, update, or follow-up…"></textarea>
            </label>
            <label class="comment-image-upload" for="comment-image-file">
              <span>Add images</span>
              <input id="comment-image-file" type="file" accept="image/*" multiple>
            </label>
            <div id="comment-image-preview" class="comment-image-preview" hidden></div>
            <button type="submit" class="primary-button">Add comment</button>
          </form>
          <ol id="comment-list" class="comment-list"></ol>
          <p id="empty-comments" class="comments-empty">No comments yet.</p>
        </section>
      </section>
    </main>

    <script src="store.js"></script>
    <script src="product.js"></script>
  </body>
</html>
