<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vendors - ToDoList Cart</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <main class="store-shell vendors-shell" aria-labelledby="vendors-title">
      <header class="store-header">
        <div class="top-row">
          <a class="brand" href="newtab.html" aria-label="Go to ToDoList Cart home">
            <img class="brand-icon" src="icons/icon-48.png" alt="">
            <span class="brand-name">ToDoList Cart</span><span class="brand-domain">.tasks</span>
          </a>
          <form class="search-bar" action="newtab.html" method="get" autocomplete="off">
            <label class="visually-hidden" for="vendor-product-search">Search task products</label>
            <input id="vendor-product-search" name="q" type="search" placeholder="Search task products">
            <button type="submit">Search</button>
          </form>
          <a class="page-link-button" href="create-product.html">Create</a>
          <a class="page-link-button" href="newtab.html">Workspace</a>
          <a class="page-link-button" href="products.html?view=wishlist">Wishlist</a>
          <a class="page-link-button" href="order-history.html">Orders</a>
          <a class="page-link-button" href="tally.html">Analytics</a>
          <a class="page-link-button active-page-link" href="vendors.html">Vendors</a>
          <a class="page-link-button" href="account.html">Account</a>
          <a class="header-icon-button comments-header-button" href="comments.html" aria-label="Open comment trails" title="Comments">
            <svg class="comment-card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.5-4A9 9 0 1 1 21 12Z"></path></svg>
          </a>
          <a class="cart-button" href="cart.html" aria-label="Open shopping cart">
            <span class="cart-icon" aria-hidden="true"></span><strong id="cart-count">0</strong><span>Cart</span>
          </a>
        </div>
        <nav class="departments" aria-label="Categories"></nav>
      </header>

      <section class="hero-strip catalog-hero" aria-label="Vendor overview">
        <div><p>Supplier network</p><h1 id="vendors-title">Vendors</h1></div>
        <div class="hero-stats" aria-live="polite">
          <span id="vendor-count">0 vendors</span>
          <span id="vendor-product-count">0 linked products</span>
          <span id="vendor-contact-count">0 SPOCs</span>
        </div>
      </section>

      <section class="vendors-layout" aria-label="Vendor management">
        <aside class="vendor-editor" aria-labelledby="vendor-form-title">
          <div class="section-heading">
            <div><p class="section-kicker">Vendor profile</p><h2 id="vendor-form-title">Add vendor</h2></div>
          </div>
          <form id="vendor-form" class="vendor-form" autocomplete="off">
            <input id="vendor-id" type="hidden">
            <label>Vendor name<input id="vendor-name" type="text" maxlength="100" placeholder="Acme Supplies" required></label>
            <label>Vendor type
              <select id="vendor-type">
                <option value="business">Business</option>
                <option value="organization">Organization</option>
                <option value="person">Individual person</option>
              </select>
            </label>
            <div class="vendor-field-pair">
              <label>Vendor phone<input id="vendor-phone" type="tel" maxlength="40" placeholder="+91 98765 43210"></label>
              <label>Vendor email<input id="vendor-email" type="email" maxlength="120" placeholder="sales@example.com"></label>
            </div>
            <label>Website<input id="vendor-website" type="url" maxlength="240" placeholder="https://example.com"></label>
            <label>Address<textarea id="vendor-address" maxlength="300" rows="3" placeholder="Office or business address"></textarea></label>
            <label>Products supplied
              <input id="vendor-product-picker-search" type="search" placeholder="Search products to link">
              <select id="vendor-products" multiple size="7" aria-describedby="vendor-products-help"></select>
              <span id="vendor-products-help" class="settings-help">Select one or more products. Hold Ctrl or Command to select several.</span>
            </label>

            <section class="vendor-contacts-editor" aria-labelledby="vendor-contacts-title">
              <div class="vendor-contacts-heading">
                <div><h3 id="vendor-contacts-title">SPOCs</h3><p>People to contact at this vendor.</p></div>
                <button type="button" id="add-vendor-contact" class="secondary-button">+ Add SPOC</button>
              </div>
              <div id="vendor-contact-rows" class="vendor-contact-rows"></div>
            </section>

            <label>Notes<textarea id="vendor-notes" maxlength="600" rows="4" placeholder="Terms, capabilities, lead times, or other notes"></textarea></label>
            <div class="vendor-form-actions">
              <button type="submit" class="primary-button" id="save-vendor">Save Vendor</button>
              <button type="button" class="secondary-button" id="cancel-vendor-edit" hidden>Cancel edit</button>
            </div>
            <p id="vendor-form-status" class="settings-status" aria-live="polite"></p>
          </form>
        </aside>

        <section class="vendor-directory" aria-labelledby="vendor-directory-title">
          <div class="vendor-directory-header">
            <div><p class="section-kicker">Directory</p><h2 id="vendor-directory-title">Vendor network</h2></div>
            <label class="vendor-search"><span class="visually-hidden">Search vendors</span><input id="vendor-search" type="search" placeholder="Search vendors, products, or SPOCs"></label>
          </div>
          <div id="vendor-list" class="vendor-list"></div>
          <div id="empty-vendors" class="empty-state vendor-empty" hidden>
            <strong>No vendors found</strong>
            <span>Add a vendor or change your search.</span>
          </div>
        </section>
      </section>
    </main>

    <template id="vendor-contact-row-template">
      <fieldset class="vendor-contact-row">
        <legend>SPOC details</legend>
        <input type="hidden" data-contact-field="id">
        <label>Name<input type="text" data-contact-field="name" maxlength="90" required></label>
        <label>Role<input type="text" data-contact-field="role" maxlength="90" placeholder="Account Manager"></label>
        <label>Phone<input type="tel" data-contact-field="phone" maxlength="40" placeholder="+91 98765 43210"></label>
        <label>Email<input type="email" data-contact-field="email" maxlength="120" placeholder="name@example.com"></label>
        <button type="button" class="remove-vendor-contact" aria-label="Remove SPOC">×</button>
      </fieldset>
    </template>

    <template id="vendor-card-template">
      <article class="vendor-card">
        <header class="vendor-card-header"><div><span class="vendor-type-badge"></span><h3></h3></div><div class="vendor-card-actions"><button type="button" class="secondary-button edit-vendor">Edit</button><button type="button" class="secondary-button delete-vendor">Delete</button></div></header>
        <div class="vendor-direct-contact"></div>
        <p class="vendor-address"></p>
        <div class="vendor-products"><strong>Products supplied</strong><div class="vendor-product-links"></div></div>
        <div class="vendor-spocs"><strong>SPOCs</strong><div class="vendor-spoc-list"></div></div>
        <p class="vendor-notes"></p>
      </article>
    </template>

    <script src="store.js"></script>
    <script src="vendors.js"></script>
  </body>
</html>
