<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Listing - ToDoList Cart</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <main class="store-shell catalog-shell" aria-labelledby="app-title">
      <header class="store-header">
        <div class="top-row">
          <a class="brand" href="newtab.html" aria-label="Go to ToDoList Cart home">
            <img class="brand-icon" src="icons/icon-48.png" alt="">
            <span class="brand-name" id="app-title">ToDoList Cart</span>
            <span class="brand-domain">.tasks</span>
          </a>

          <form id="search-form" class="search-bar" autocomplete="off">
            <label class="visually-hidden" for="search-products">Search products</label>
            <input id="search-products" type="search" placeholder="Search all products">
            <button type="submit">Search</button>
          </form>

          <a class="page-link-button" href="create-product.html">Create</a>

          <a class="page-link-button" id="open-home-page" href="newtab.html">Workspace</a>
          <a class="page-link-button" href="products.html?view=wishlist">Wishlist</a>

          <button type="button" class="page-link-button" id="open-orders-page">Orders</button>
          <a class="page-link-button" href="tally.html">Analytics</a>
          <a class="page-link-button" href="vendors.html">Vendors</a>

          <button type="button" class="page-link-button" id="open-account-page">Account</button>

          <a class="header-icon-button comments-header-button" href="comments.html" aria-label="Open comment trails" title="Comments">
            <svg class="comment-card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.5-4A9 9 0 1 1 21 12Z"></path></svg>
          </a>
          <button type="button" class="cart-button" id="cart-jump" aria-label="Cart count">
            <span class="cart-icon" aria-hidden="true"></span>
            <strong id="cart-count">0</strong>
            <span>Cart</span>
          </button>
        </div>

        <nav class="departments" aria-label="Categories">
          <button type="button" class="active" data-department="all">All</button>
        </nav>
      </header>

      <section class="hero-strip catalog-hero" aria-label="Listing overview">
        <div>
          <p>Product listing</p>
          <h1 id="listing-title">All todo products</h1>
        </div>
        <div class="hero-stats" aria-live="polite">
          <span id="product-count">0 products</span>
          <span id="visible-count">0 shown</span>
          <span id="cart-summary">My Cart: 0 open</span>
        </div>
      </section>

      <section class="catalog-layout" aria-label="Product listing">
        <aside class="catalog-sidebar" id="cart-panel" aria-label="Cart switcher">
          <div class="section-heading">
            <h2>Switch Cart</h2>
          </div>

          <div class="cart-manager">
            <label for="cart-select">Active cart</label>
            <select id="cart-select" aria-label="Active cart"></select>
          </div>
        </aside>

        <section class="product-shelf listing-shelf" aria-labelledby="products-heading">
          <div class="section-heading">
            <h2 id="products-heading">Products</h2>
            <div class="listing-toolbar">
              <label class="product-sort-control" for="product-sort">
                <span>Sort by</span>
                <select id="product-sort">
                  <option value="default">Default</option>
                  <option value="price-asc">Price: Low to high</option>
                  <option value="price-desc">Price: High to low</option>
                  <option value="time-asc">Time: Shortest first</option>
                  <option value="time-desc">Time: Longest first</option>
                  <option value="comments-desc">Comments: Most first</option>
                  <option value="comments-asc">Comments: Fewest first</option>
                </select>
              </label>
              <div class="view-toggle" role="group" aria-label="Product view">
                <button type="button" class="view-toggle-button active" data-view="card" aria-pressed="true">▦ <span>Cards</span></button>
                <button type="button" class="view-toggle-button" data-view="list" aria-pressed="false">☷ <span>List</span></button>
              </div>
            </div>
          </div>

          <ul id="product-list" class="product-list"></ul>
          <div id="empty-products" class="empty-state" hidden>
            <strong>No products found</strong>
            <span>Create a product in the workspace or change your search.</span>
          </div>
        </section>
      </section>
    </main>

    <template id="product-template">
      <li class="product-card">
        <div class="product-image">
          <span></span>
          <button type="button" class="wishlist-button" aria-label="Add to wishlist">♡</button>
        </div>
        <div class="product-copy">
          <strong class="product-title"></strong>
          <p class="product-description"></p>
          <div class="rating-row" aria-label="Priority">
            <span class="rating-stars" aria-hidden="true">*****</span>
            <span class="priority-label"></span>
          </div>
          <div class="product-meta">
            <button type="button" class="department-label card-filter-button" data-card-filter="category"></button>
            <button type="button" class="location-label card-filter-button" data-card-filter="location"><svg class="card-meta-icon location-card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg><span class="location-value"></span></button>
            <span class="moq-label"></span>
            <span class="units-label"></span>
            <span class="price-label"></span>
            <span class="time-label" hidden><svg class="card-meta-icon time-card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2"></path></svg><span class="time-value"></span></span>
            <button type="button" class="comment-count-button"><svg class="comment-card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.5-4A9 9 0 1 1 21 12Z"></path></svg><span class="comment-count-value">0</span></button>
          </div>
          <div class="delivery-line">Prime task delivery</div>
          <span class="stock-status" hidden>Out of stock</span>
        </div>
        <div class="product-actions">
          <button type="button" class="add-cart-button">Add to Cart</button>
          <button type="button" class="buy-now-button">Buy Now</button>
        </div>
      </li>
    </template>

    <script src="store.js"></script>
    <script src="products.js"></script>
  </body>
</html>
