<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDoList Cart</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="launcher" aria-labelledby="launcher-title">
      <header class="launcher-header">
        <img src="icons/icon-48.png" alt="" width="48" height="48">
        <div><p>YOUR TASK WORKSPACE</p><h1 id="launcher-title">ToDoList Cart</h1></div>
        <button type="button" class="icon-button" data-open="account.html" aria-label="Open settings" title="Settings">⚙</button>
      </header>

      <section class="store-choices" aria-labelledby="choose-store-heading">
        <div class="section-intro">
          <h2 id="choose-store-heading">Where would you like to go?</h2>
          <p>Open your workspace or explore every feature with sample data.</p>
        </div>
        <button type="button" class="store-choice live-choice" data-store-mode="live">
          <span class="choice-icon" aria-hidden="true">🏬</span>
          <span class="choice-copy"><strong>View Live Store</strong><small>Open your products, carts, and current tasks</small></span>
          <span class="choice-arrow" aria-hidden="true">→</span>
        </button>
        <button type="button" class="store-choice demo-choice" data-store-mode="demo">
          <span class="choice-icon" aria-hidden="true">✨</span>
          <span class="choice-copy"><strong>View Demo Store</strong><small>Try a complete sample workspace with images</small></span>
          <span class="choice-arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <button type="button" class="add-task-button" data-open="create-product.html">
        <span aria-hidden="true">＋</span>
        <span><strong>Add New Task</strong><small>Create a new product-style task</small></span>
      </button>

      <section class="feature-section" aria-labelledby="features-heading">
        <div class="section-heading"><h2 id="features-heading">Quick access</h2><span>All features</span></div>
        <div class="feature-grid">
          <button type="button" data-open="cart.html"><span aria-hidden="true">🛒</span><strong>Cart</strong></button>
          <button type="button" data-open="products.html?view=wishlist"><span aria-hidden="true">♥</span><strong>Wishlist</strong></button>
          <button type="button" data-open="order-history.html"><span aria-hidden="true">📦</span><strong>Orders</strong></button>
          <button type="button" data-open="tally.html"><span aria-hidden="true">📊</span><strong>Analytics</strong></button>
          <button type="button" data-open="vendors.html"><span aria-hidden="true">🤝</span><strong>Vendors</strong></button>
          <button type="button" data-open="comments.html"><span aria-hidden="true">💬</span><strong>Comments</strong></button>
          <button type="button" data-open="products.html?view=archived"><span aria-hidden="true">🗄️</span><strong>Archive</strong></button>
          <button type="button" data-open="account.html"><span aria-hidden="true">⚙️</span><strong>Settings</strong></button>
        </div>
      </section>

      <footer class="launcher-footer">
        <button type="button" id="request-feature"><span aria-hidden="true">💡</span> Request a Feature</button>
        <button type="button" id="report-problem">Report a Problem</button>
      </footer>
      <p id="launcher-status" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script src="popup-menu.js"></script>
  </body>
</html>
