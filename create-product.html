<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Product - ToDoList Cart</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <main class="store-shell create-page-shell" aria-labelledby="create-title">
      <header class="store-header">
        <div class="top-row">
          <a class="brand" href="newtab.html" aria-label="Go to ToDoList Cart home">
            <img class="brand-icon" src="icons/icon-48.png" alt="">
            <span class="brand-name">ToDoList Cart</span>
            <span class="brand-domain">.tasks</span>
          </a>

          <div class="detail-search-spacer"></div>
          <a class="page-link-button" href="newtab.html">Workspace</a>
          <a class="page-link-button" href="products.html">Products</a>
          <a class="page-link-button" href="order-history.html">Orders</a>
          <a class="page-link-button" href="account.html">Account</a>
          <a class="cart-button" href="newtab.html#cart-panel" aria-label="Open shopping cart">
            <span class="cart-icon" aria-hidden="true"></span>
            <strong id="cart-count">0</strong>
            <span>Cart</span>
          </a>
        </div>
      </header>

      <section class="hero-strip catalog-hero" aria-label="Create product overview">
        <div>
          <p>Product studio</p>
          <h1 id="create-title">Create a new task product</h1>
        </div>
        <div class="hero-stats" aria-live="polite">
          <span id="product-count">0 products</span>
        </div>
      </section>

      <section class="create-page-layout">
        <section class="create-product create-product-page" aria-labelledby="form-heading">
          <div class="section-heading">
            <div>
              <p class="section-kicker">Add to catalog</p>
              <h2 id="form-heading">Product details</h2>
            </div>
            <a class="back-to-products" href="newtab.html">Back to workspace</a>
          </div>

          <form id="product-form" class="product-form" autocomplete="off">
            <div class="form-field">
              <label for="product-title">Product name</label>
              <input id="product-title" name="title" type="text" maxlength="90" placeholder="Finish project report" required>
            </div>

            <div class="form-field">
              <label for="product-location">Location</label>
              <input id="product-location" name="location" type="text" maxlength="80" placeholder="Office, Home, Downtown…">
            </div>

            <div class="form-field">
              <label for="product-description">Product details</label>
              <textarea id="product-description" name="description" maxlength="500" placeholder="Add deadline, notes, or context"></textarea>
            </div>

            <div class="form-row create-form-row">
              <label>
                Category
                <select id="product-department" name="department" aria-label="Category"></select>
              </label>

              <fieldset class="priority-toggle" aria-label="Priority">
                <legend>Priority</legend>
                <label><input type="radio" name="priority" value="standard" checked><span>Standard</span></label>
                <label><input type="radio" name="priority" value="important"><span>Important</span></label>
                <label><input type="radio" name="priority" value="urgent"><span>Urgent</span></label>
              </fieldset>
            </div>

            <div id="category-form" class="category-form">
              <label for="category-name">New category</label>
              <input id="category-name" type="text" maxlength="32" placeholder="Marketing">
              <button type="button" id="add-category" class="secondary-button">Add Category</button>
            </div>

            <div class="moq-price-row">
              <label>MOQ<input id="product-moq" name="moq" type="number" min="1" step="1" inputmode="numeric" required></label>
              <label>Dollar amount<input id="product-price" name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required></label>
            </div>

            <div class="image-row">
              <label>Image URL<input id="product-image-url" name="imageUrl" type="url" placeholder="https://example.com/product.png"></label>
              <label class="image-upload" for="product-image-file">
                <span>Upload Images (up to 8)</span>
                <input id="product-image-file" name="imageFile" type="file" accept="image/*" multiple>
              </label>
            </div>

            <div id="image-preview" class="image-preview" hidden>
              <div class="image-preview-grid" aria-label="Selected product images"></div>
              <button type="button" id="clear-image" class="secondary-button">Remove All Images</button>
            </div>

            <div id="product-image-dropzone" class="image-dropzone" tabindex="0">Drop images here or paste from clipboard</div>
            <button type="submit" class="primary-button create-submit">Create Product</button>
          </form>
        </section>
      </section>
    </main>

    <script src="store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
